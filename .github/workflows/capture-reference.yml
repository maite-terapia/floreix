name: capture-reference

on:
  push:
    paths:
      - '.github/workflows/capture-reference.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture reference pages
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser = await chromium.launch({headless:true});
          fs.mkdirSync('reference', {recursive:true});
          const targets = [
            ['home','https://floreix.com/'],
            ['psicoterapia','https://floreix.com/psicoterapia/'],
            ['terapia-a-la-natura','https://floreix.com/terapia-a-la-natura/'],
            ['about','https://floreix.com/about/'],
            ['metodologia','https://floreix.com/metodologia/'],
            ['contact','https://floreix.com/contact/'],
            ['privacy-policy','https://floreix.com/privacy-policy/']
          ];
          const report = {};
          for (const [name,url] of targets) {
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto(url,{waitUntil:'networkidle',timeout:120000});
            await page.screenshot({path:`reference/${name}-desktop.png`,fullPage:true});
            fs.writeFileSync(`reference/${name}.html`, await page.content());
            report[name] = await page.evaluate(() => ({
              title: document.title,
              url: location.href,
              bodyFont:getComputedStyle(document.body).fontFamily,
              bodyColor:getComputedStyle(document.body).color,
              bodyBackground:getComputedStyle(document.body).backgroundColor,
              h1:[...document.querySelectorAll('h1')].map(el=>({text:el.textContent.trim(),font:getComputedStyle(el).fontFamily,size:getComputedStyle(el).fontSize,weight:getComputedStyle(el).fontWeight,lineHeight:getComputedStyle(el).lineHeight,color:getComputedStyle(el).color,letterSpacing:getComputedStyle(el).letterSpacing,rect:el.getBoundingClientRect().toJSON()})),
              images:[...document.images].map(img=>({src:img.currentSrc||img.src,alt:img.alt,width:img.getBoundingClientRect().width,height:img.getBoundingClientRect().height})).filter(x=>x.src && !x.src.startsWith('data:'))
            }));
            await page.close();
          }
          for (const [name,url] of [['home','https://floreix.com/'],['about','https://floreix.com/about/']]) {
            const page = await browser.newPage({viewport:{width:390,height:844}});
            await page.goto(url,{waitUntil:'networkidle',timeout:120000});
            await page.screenshot({path:`reference/${name}-mobile.png`,fullPage:true});
            await page.close();
          }
          fs.writeFileSync('reference/report.json', JSON.stringify(report,null,2));
          await browser.close();
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: floreix-reference-all
          path: reference/
